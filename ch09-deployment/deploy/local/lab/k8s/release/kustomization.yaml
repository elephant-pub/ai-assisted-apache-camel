# Deploy lab only (design 006 wave 5, plan Task 32): the release (deploy/k8s/base) in namespace trailhead-lab, with the
# lab systems' settings (the values of k8s/today.yaml) and the locally built image trailhead/order-integration:006
# (loaded with `kind load docker-image`). Never a release: deploy/k8s/release names the image by digest.
#   deploy/local/lab/lab.sh app-sts deploy/local/lab/k8s/release
# The Secrets come from deploy/ci/smoke.sh (`SECRETS_DIR=target/lab/secrets … smoke.sh secrets`), the files the lab
# systems run with.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: trailhead-lab
resources:
  - ../../../../k8s/base
configMapGenerator:
  - name: order-integration-settings
    options:
      disableNameSuffixHash: true
    literals:
      - KAFKA_BROKERS=kafka:9092
      - DB_HOST=postgres.trailhead-lab.svc
      - DB_PORT=5432
      - DB_NAME=orders
      - DB_USERNAME=trailhead
      - CATALOG_HOST=catalog
      - CATALOG_PORT=8091
      - SMTP_HOST=mail.trailhead-lab.svc
      - SMTP_PORT=1025
      - ORDERDESK_MAILBOX=order-desk@trailhead.example
      - ORDERDESK_SENDER=order-integration@trailhead.example
      - PARTNER_HTTP_PORT=8443
      - PARTNER_MAIL_SENDER=orders@trailhead.example
      - WAREHOUSE_SFTP_HOST=sftp
      - WAREHOUSE_SFTP_PORT=22
      - WAREHOUSE_SFTP_USERNAME=admin
images:
  - name: order-integration
    newName: trailhead/order-integration
    newTag: "006"
patches:
  - target: {kind: StatefulSet, name: order-integration}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
      # Lab only, as in deploy/k8s/ci (W4-F2): the lab mail server's certificate is signed by the lab CA
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: JAVA_TOOL_OPTIONS
          value: -Djavax.net.ssl.trustStore=/etc/trailhead/files/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit
