# Test-side settings of the executable spec tests (design 004 §3.1), read by the harness, not by the integration.
spec-test.startup-timeout-ms=120000
# Upper bound for an expected event (pick list, email); far below the test case's own limit (A-9)
spec-test.arrival-timeout-ms=60000
# How long "nothing more happens" is watched: at least 5 poll cycles of every poller (A-10)
spec-test.quiet-period-ms=10000
spec-test.excluded-ports=8080,8081,5432
# Container images, each pinned to an exact version plus digest (design review, decision 2; table in §2).
# The digest is the multi-arch index digest of the tag, resolved on 2026-11-13 (plan P-8). atmoz/sftp has no version
# tags; its digest is that of the Alpine variant (a single amd64 image).
spec-test.image.kafka=apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
spec-test.image.postgres=postgres:16.16-alpine3.24@sha256:0adbf25a9e96d38823bb813f3ac0ed41fadb665c88f1df7fe6dbfb060cbdc106
spec-test.image.sftp=atmoz/sftp@sha256:c5fb9e4beb8b7054a4c0b65c5e11df47cc20da95ad6002e88aecff62bab06372
