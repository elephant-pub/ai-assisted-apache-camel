# ============================================
# Without a profile (Spring Boot's "default" profile is active only when no other profile is).
# Every host, port, address and secret comes from the environment, with no default: when a variable is not set,
# the application refuses to start and names it. The Order Database connection is TLS with server identity check
# (C-024), and the SMTP connection requires STARTTLS (B-7, OQ-076).
# ============================================
kafka.brokers=${KAFKA_BROKERS}
# Design 006 D10: the pod name; a restarted or replaced order-integration-0 takes its partitions back at once
peakmart.group-instance-id=${HOSTNAME}
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=verify-full&sslrootcert=${DB_SSL_ROOT_CERT}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
catalog.host=${CATALOG_HOST}
catalog.port=${CATALOG_PORT}
smtp.host=${SMTP_HOST}
smtp.port=${SMTP_PORT}
smtp.starttls=true
camel.component.smtp.username=${SMTP_USERNAME}
camel.component.smtp.password=${SMTP_PASSWORD}
orderdesk.mailbox=${ORDERDESK_MAILBOX}
orderdesk.sender=${ORDERDESK_SENDER}
# --- Pipeline 003: partner endpoint over TLS 1.2+ (PEM bundle, NFR-010), partners, rejection emails, pick lists ---
server.port=${PARTNER_HTTP_PORT}
server.ssl.enabled=true
server.ssl.bundle=partner-endpoint
spring.ssl.bundle.pem.partner-endpoint.keystore.certificate=${PARTNER_TLS_CERTIFICATE}
spring.ssl.bundle.pem.partner-endpoint.keystore.private-key=${PARTNER_TLS_PRIVATE_KEY}
partner.configuration=${PARTNER_CONFIGURATION}
secret-store.directory=${SECRET_STORE_DIR}
partner.mail-sender=${PARTNER_MAIL_SENDER}
warehouse.sftp.host=${WAREHOUSE_SFTP_HOST}
warehouse.sftp.port=${WAREHOUSE_SFTP_PORT}
warehouse.sftp.username=${WAREHOUSE_SFTP_USERNAME}
warehouse.sftp.password=${WAREHOUSE_SFTP_PASSWORD}
warehouse.sftp.known-hosts=${WAREHOUSE_SFTP_KNOWN_HOSTS}
