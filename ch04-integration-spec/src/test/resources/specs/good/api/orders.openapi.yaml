openapi: 3.1.0
info: { title: Orders, version: 1.0.0 }
paths:
  /orders:
    post:
      operationId: submitOrder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '../messages/order.schema.json' }
      responses:
        '202': { description: Accepted }
        '422': { description: Rejected }
