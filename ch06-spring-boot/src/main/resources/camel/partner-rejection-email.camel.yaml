# Flow partner-rejection-email (design 003 §3, FR-006, UC-001 BR-005): deliver every pending Rejection Email to the
# Order Contact of the Partner, once per Rejected Partner Order, retrying on the next poll until the mail server takes
# it, also after a restart. The same pattern as order-desk-notification (002); its own route because the selection,
# the subject and the sender differ. The notification row is marked sent only after the SMTP server accepted it.
- routeConfiguration:
    id: partner-rejection-email-error-handling
    description: A Rejection Email that could not be sent stays pending and is tried again on the next poll
    onException:
      - onException:
          id: on-partner-rejection-email-failure
          exception:
            - java.lang.Exception
          # Not handled on purpose: a handled failure would run onConsume and mark an unsent email as sent
          handled:
            constant:
              expression: "false"
          redeliveryPolicy:
            maximumRedeliveries: 0
            logExhaustedMessageBody: false
            logExhaustedMessageHistory: false
          steps:
            - log:
                id: log-partner-rejection-email-not-sent
                loggingLevel: WARN
                message: "Rejection email not sent, tried again on the next poll orderNumber=${exchangeProperty.order-number} correlationId=${exchangeProperty.correlation-id} cause=${exception.class.name}"

- route:
    id: partner-rejection-email-send
    description: Deliver each pending Rejection Email as a plain-text email to the Partner's Order Contact
    routeConfigurationId: partner-rejection-email-error-handling
    from:
      id: from-rejection-email-outbox
      uri: sql:classpath:sql/rejection-email-select.sql
      parameters:
        dataSource: "#dataSource"
        delay: "{{notification.poll-delay-ms}}"
        # RAW(...) keeps the '+' literal; LEAST(..., 1000) keeps attempts inside its CHECK (design 002 D4)
        onConsume: "RAW(UPDATE notification SET sent_at = now(), attempts = LEAST(attempts + 1, 1000) WHERE id = :#notification_id)"
        onConsumeFailed: "RAW(UPDATE notification SET attempts = LEAST(attempts + 1, 1000) WHERE id = :#notification_id)"
      steps:
        - setProperty:
            id: set-rejection-email-order-number
            name: order-number
            expression:
              simple:
                expression: "${body[order_number]}"
        - setProperty:
            id: set-rejection-email-correlation-id
            name: correlation-id
            expression:
              simple:
                expression: "${body[correlation_id]}"
        # Camel mail turns message headers into mail headers: nothing from the row or the consumer may reach the email
        - removeHeaders:
            id: remove-headers-before-rejection-email
            pattern: "*"
        # The Order Contact registered for the Partner at rejection time, never an address from the order; never logged
        - setHeader:
            id: set-header-rejection-email-to
            name: To
            expression:
              simple:
                expression: "${body[recipient_email]}"
        - setHeader:
            id: set-header-rejection-email-subject
            name: Subject
            expression:
              simple:
                expression: "Order ${exchangeProperty.order-number} rejected"
        # Only the order number and the reasons (C-023)
        - setBody:
            id: set-body-rejection-email-text
            expression:
              simple:
                expression: |-
                  Order number: ${exchangeProperty.order-number}
                  ${body[reason_lines]}
        # Credentials are component options (camel.component.smtp.*), never part of this URI
        - to:
            id: to-partner-order-contact
            uri: smtp://{{smtp.host}}:{{smtp.port}}
            parameters:
              from: "{{partner.mail-sender}}"
              useHeaderRecipients: true
              useHeaderSubject: true
              contentType: "text/plain; charset=UTF-8"
              connectionTimeout: "{{smtp.timeout-ms}}"
              mail.smtp.timeout: "{{smtp.timeout-ms}}"
              mail.smtp.writetimeout: "{{smtp.timeout-ms}}"
              mail.smtp.starttls.enable: "{{smtp.starttls}}"
              mail.smtp.starttls.required: "{{smtp.starttls}}"
        - log:
            id: log-rejection-email-sent
            loggingLevel: INFO
            message: "Rejection email sent orderNumber=${exchangeProperty.order-number} correlationId=${exchangeProperty.correlation-id}"
