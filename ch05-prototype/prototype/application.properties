# ============================================
# Trailhead Peakmart intake prototype (Camel Main, `camel run`)
# Design: docs/camel-kit/001-peakmart-intake/design-spec.md
# Uses the Kafka (9092) and PostgreSQL (15432) that `camel infra` already runs; opens no HTTP port.
# ============================================
camel.main.name=peakmart-intake-prototype

# --- Flow peakmart-order-intake ---
kafka.brokers=localhost:9092
peakmart.topic=peakmart.orders.v2
peakmart.group-id=trailhead-order-integration
peakmart.auto-offset-reset=earliest
# Largest record (decoded characters) read as an Order Event; larger records are set aside as "too large"
peakmart.max-record-chars=1048576
# Test hook for kill-test.sh only: delay before the offset commit, in ms
peakmart.test.commit-delay-ms={{env:COMMIT_DELAY_MS:0}}
peakmart.email-pattern=^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$
# Schemas are read in place, never copied
schemas.dir=../docs/messages
sql.dir=sql

# --- Flow peakmart-order-check ---
order-check.poll-delay-ms=5000
order-check.batch-size=50
# Host and port of the Product Catalog; the route names the http component itself, so checks and readers see it
catalog.host=localhost:8091
catalog.timeout-ms=2000
catalog.max-calls-per-second=20
orderdesk.mailbox=order-desk@trailhead.example
# In camel-http 4.22.2 the three timeouts are component options only (catalog-verified), so they are set here
camel.component.http.connect-timeout={{catalog.timeout-ms}}
camel.component.http.response-timeout={{catalog.timeout-ms}}
camel.component.http.connection-request-timeout={{catalog.timeout-ms}}

# --- Flow order-desk-notification ---
notification.poll-delay-ms=5000
orderdesk.outbox-dir=target/outbox/order-desk

# --- Order Database (user can be overridden with DB_USERNAME; the password comes only from DB_PASSWORD) ---
db.url=jdbc:postgresql://localhost:15432/postgres
db.username={{env:DB_USERNAME:test}}
db.password={{env:DB_PASSWORD}}

# --- Log masking: safety net only; log lines carry identifiers and counts, never the body (NFR-011) ---
camel.main.logMask=true
camel.main.additionalSensitiveKeywords=email,phone,ssn,creditCard

# --- Beans ---
# Reason: Forage is unavailable (no forage.version in .camel-kit/config.properties; Camel 4.22.2 is not in the shipped Forage mapping)
camel.beans.orderDb=#class:org.postgresql.ds.PGSimpleDataSource
camel.beans.orderDb.url={{db.url}}
camel.beans.orderDb.user={{db.username}}
camel.beans.orderDb.password={{db.password}}
# Reason: UC-003 Order Checks are business logic, kept in a plain Java bean (constitution rule 3)
camel.beans.orderChecks=#class:OrderChecks
# Reason: builds the set-aside reason <path>: <keyword> without the validator message (design review item 4)
camel.beans.cannotReadReason=#class:CannotReadReason

# --- Main runtime: dependencies resolved by `camel run` (pgjdbc 42.7.13 is the version Camel 4.22.2 manages) ---
camel.jbang.dependencies=org.apache.camel:camel-kafka:4.22.2,org.apache.camel:camel-sql:4.22.2,org.apache.camel:camel-http:4.22.2,org.apache.camel:camel-json-validator:4.22.2,org.apache.camel:camel-jsonpath:4.22.2,org.apache.camel:camel-groovy:4.22.2,org.apache.camel:camel-file:4.22.2,org.apache.camel:camel-timer:4.22.2,org.apache.camel:camel-bean:4.22.2,org.apache.camel:camel-direct:4.22.2,org.postgresql:postgresql:42.7.13
