# Product Catalog stub (Camel Main, separate `camel run`), port 8091 (design review item 1; 8080/8081 are taken)
camel.main.name=product-catalog-stub
camel.server.enabled=true
camel.server.port=8091
# Reachable from this machine only (validation: security checklist rule 5)
camel.server.host=127.0.0.1

# Fault mode: normal | invalid (serve invalid/active-missing.json for every SKU) | slow (answer after 3 s)
stub.mode=normal
# Product examples, read in place (never copied)
stub.examples-dir=../../../docs/messages/examples/product

# Main runtime: dependencies resolved by `camel run`
camel.jbang.dependencies=org.apache.camel:camel-platform-http:4.22.2,org.apache.camel:camel-rest-openapi:4.22.2,org.apache.camel:camel-groovy:4.22.2
