# ============================================
# Trailhead Order Integration (Spring Boot) - settings shared by every profile
# Design: docs/camel-kit/002-spring-boot-move/design-spec.md
# Hosts, ports, addresses and secrets are in application-default.properties (no profile: environment only) and
# config/application-dev.properties (local services; outside the jar since pipeline 003). A value that refers to another property uses Spring's ${...};
# only the YAML routes use Camel's double-brace placeholders.
# ============================================

# --- Camel and Spring Boot ---
camel.main.name=trailhead-order-integration
# Keeps the JVM running (since pipeline 003 the web server of the partner endpoint also does)
camel.main.run-controller=true
# Log masking: safety net only; log lines carry identifiers and counts, never the body (NFR-011)
camel.main.log-mask=true
camel.main.additional-sensitive-keywords=email,phone,ssn,creditCard
# Flyway V1 creates the Order Database schema at startup, before the Camel routes start
spring.flyway.locations=classpath:db/migration

# --- Flow peakmart-order-intake ---
peakmart.topic=peakmart.orders.v2
peakmart.group-id=trailhead-order-integration
peakmart.auto-offset-reset=earliest
# Largest record (decoded characters) read as an Order Event; larger records are set aside as "too large"
peakmart.max-record-chars=1048576
# The backslashes are doubled because java.util.Properties reads "\s" as "s" (E7; guarded by EmailPatternTest)
peakmart.email-pattern=^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$

# --- Flow peakmart-order-check ---
order-check.poll-delay-ms=5000
order-check.batch-size=50
catalog.timeout-ms=2000
catalog.max-calls-per-second=20
# In camel-http 4.22.2 the three timeouts are component options only (catalog-verified)
camel.component.http.connect-timeout=${catalog.timeout-ms}
camel.component.http.response-timeout=${catalog.timeout-ms}
camel.component.http.connection-request-timeout=${catalog.timeout-ms}

# --- Flow order-desk-notification ---
notification.poll-delay-ms=5000
# Connect, read and write timeout of the SMTP connection, in ms
smtp.timeout-ms=10000

# --- Pipeline 003: flow partner-order-api (design 003 §3) ---
# Largest partner request body, in characters (C-10)
partner.max-request-chars=1048576
# The "being checked" mark of a partner receipt expires after this many seconds (OQ-074 answered, reading b)
partner.checking-expiry-seconds=30
# Threads of the parallel Product Catalog lookups, behind the one shared throttle (C-13)
catalog.lookup-threads=10
# The catalogLookupPool bean is an Executor, which makes Spring Boot skip its own applicationTaskExecutor; platform-http
# needs that one, so it is created anyway
spring.task.execution.mode=force
# No actuator over HTTP: the web server serves only the partner endpoint (C-22)
management.server.port=-1
server.ssl.enabled-protocols=TLSv1.3,TLSv1.2

# --- Pipeline 003: flow pick-list-delivery ---
pick-list.poll-delay-ms=30000
pick-list.batch-size=50
warehouse.sftp.inbound-directory=/inbound/picklists
warehouse.sftp.processed-directory=/inbound/picklists/processed
# Connect and socket timeout of the SFTP connection, in ms
warehouse.sftp.timeout-ms=10000
