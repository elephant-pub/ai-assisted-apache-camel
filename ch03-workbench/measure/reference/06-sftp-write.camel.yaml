- route:
    id: warehouse-pick-lists
    from:
      uri: direct:pick-list
      steps:
        - to:
            uri: sftp:warehouse.trailhead.example/inbound/picklists
            parameters:
              username: trailhead
              password: "{{warehouse.password}}"
              tempFileName: "${file:name}.part"
              fileExist: Fail
              strictHostKeyChecking: "yes"
