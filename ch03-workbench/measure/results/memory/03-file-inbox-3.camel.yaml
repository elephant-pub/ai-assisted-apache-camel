- route:
    id: order-file-intake
    from:
      uri: file:work/inbox
      parameters:
        # Only pick up *.json files
        include: ".*\\.json"
        # Wait until the file has stopped changing (slow writer)
        readLock: changed
        readLockCheckInterval: 2000
        readLockTimeout: 30000
        readLockMinAge: 5s
        # On success: .done/<yyyy-MM-dd>/<file name>
        move: ".done/${date:now:yyyy-MM-dd}/${file:name}"
        # On failure: .error/<file name>
        moveFailed: ".error/${file:name}"
      steps:
        - to:
            uri: direct:intake
