- route:
    id: supplier-invoices-sftp-poller
    from:
      # Double slash after the host = absolute remote path /outbound/invoices
      uri: "sftp:sftp.supplier.example//outbound/invoices"
      parameters:
        username: trailhead
        privateKeyFile: /secrets/id_ed25519
        knownHostsFile: /secrets/known_hosts
        strictHostKeyChecking: "yes"
        useUserKnownHostsFile: false
        include: '.*\.csv'
        delete: true
        delay: 300000
      steps:
        - to:
            uri: "file:work/invoices"
