- route:
    id: enrich-from-catalog
    from:
      uri: direct:enrich
      steps:
        - toD:
            uri: https://catalog.trailhead.example/products/${header.sku}
            parameters:
              httpMethod: GET
              # connect timeout: 2s, response timeout: 5s (RequestConfig via httpClient.* prefix)
              httpClient.connectTimeout: 2000
              httpClient.responseTimeout: 5000
              # treat 404 as a normal response (no HttpOperationFailedException)
              okStatusCodeRange: 200-299,404
