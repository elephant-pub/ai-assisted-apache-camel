spring.application.name=order-intake
camel.main.name=order-intake

# Routes are written twice, in Java (OrderRoutes) and YAML (routes/). Java runs unless the yaml profile is on.
trailhead.routes=java

# Local adapters for the Chapter 2 walking skeleton. Tests replace these with mock: endpoints.
trailhead.peakmart.inbox=file:work/peakmart-inbox?move=.done&moveFailed=.failed
trailhead.orders.rejected=file:work/rejected
trailhead.orders.set-aside=file:work/set-aside
trailhead.warehouse.outbox=file:work/warehouse
