# ============================================
# Profile dev (--spring.profiles.active=dev): the local services `camel infra` and the stub run.
# No TLS and no SMTP login (Mailpit). The test/test credentials are those of the local PostgreSQL only (B-4).
# ============================================
kafka.brokers=localhost:9092
spring.datasource.url=jdbc:postgresql://localhost:15432/postgres
spring.datasource.username=test
spring.datasource.password=test
catalog.host=127.0.0.1
catalog.port=8091
smtp.host=localhost
smtp.port=1025
smtp.starttls=false
orderdesk.mailbox=order-desk@trailhead.example
orderdesk.sender=order-integration@trailhead.example
# --- Pipeline 003 (design 003 §2, C-14, C-1, C-2, C-15, C-17). This file lives in ./config/, outside the jar
# (carried item 7); Spring Boot reads it from the working directory, the project root. ---
# Plain HTTP on 8082 for the partner endpoint (R5); TLS only without a profile
server.port=8082
server.ssl.enabled=false
partner.configuration=config/dev/partner-configuration.json
# Secret Store stand-in: development-only key, never a real one (config/dev/secrets/README.md)
secret-store.directory=config/dev/secrets
partner.mail-sender=orders@trailhead.example
# The warehouse SFTP server in development: the atmoz/sftp container from README.md, on 127.0.0.1:2222 only
# (admin/admin). The sessions used `camel infra run sftp`, which serves the whole file system on every interface.
# Host key: ssh-keyscan -p 2222 -t ed25519 127.0.0.1 > config/dev/warehouse_known_hosts
warehouse.sftp.host=127.0.0.1
warehouse.sftp.port=2222
warehouse.sftp.username=admin
warehouse.sftp.password=admin
warehouse.sftp.known-hosts=config/dev/warehouse_known_hosts
# The dev server maps the folders relative to the login directory (checked with one stat, Task 16)
warehouse.sftp.inbound-directory=inbound/picklists
warehouse.sftp.processed-directory=inbound/picklists/processed
